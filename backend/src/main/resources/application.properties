spring.application.name=logistica-grupo5
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistica_g5}
spring.datasource.username=${DB_USER:logistica}
spring.datasource.password=${DB_PASSWORD:logistica}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/Santiago'
app.keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost:8081/realms/logistica-g5}
app.keycloak.audience=${KEYCLOAK_AUDIENCE:logistica-api}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
spring.jackson.time-zone=America/Santiago
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
app.keycloak.admin.base-url=${KEYCLOAK_BASE_URL:http://localhost:8081}
app.keycloak.admin.realm=${KEYCLOAK_REALM:logistica-g5}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:logistica-admin}
app.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:logistica-admin-dev-secret}
